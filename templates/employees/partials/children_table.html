<table class="table table-hover mb-0">
    <thead class="table-light">
        <tr>
            <th>ФИО ребенка</th>
            <th>Дата рождения</th>
            <th>Возраст</th>
        </tr>
    </thead>
    <tbody>
        {% for child in children %}
        <tr>
            <td>{{ child.full_name }}</td>
            <td>{{ child.birth_date|date:"d.m.Y" }}</td>
            <td>{{ child.birth_date|timesince }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted py-3">Нет данных о детях</td></tr>
        {% endfor %}
    </tbody>
</table>
