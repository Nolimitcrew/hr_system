{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block after_field_sets %}
{{ block.super }}
<!-- Блок проверки Telegram -->
<div class="form-row" style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px;">
    <div>
        <h3 style="margin-bottom: 10px; color: #417690;">Проверка интеграции</h3>
        <p style="margin-bottom: 10px; color: #666;">Введите текст, чтобы проверить правильность токена и Chat ID.</p>

        <textarea id="test-telegram-text" rows="2" style="width: 100%; max-width: 600px; padding: 8px; margin-bottom: 10px;" placeholder="Привет! Это тест...">Привет! Это тестовое сообщение из HR-Системы. Связь работает отлично!</textarea>

        <br>
        <button type="button" id="btn-test-telegram" class="button" style="background-color: #417690; color: white; border: none; padding: 8px 15px; cursor: pointer;">
            Отправить тестовое сообщение
        </button>

        <div id="telegram-result" style="margin-top: 15px; font-weight: bold;"></div>
    </div>
</div>

<!-- Скрипт для отправки запроса -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('btn-test-telegram');
        const textInput = document.getElementById('test-telegram-text');
        const resultDiv = document.getElementById('telegram-result');

        btn.addEventListener('click', function() {
            btn.disabled = true;
            btn.innerText = 'Отправка...';
            resultDiv.innerHTML = '';
            resultDiv.style.color = 'black';

            // Получаем CSRF-токен из cookie (стандартный метод Django)
            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }
            const csrftoken = getCookie('csrftoken');

            const formData = new FormData();
            formData.append('message', textInput.value);

            // Отправляем запрос на наш существующий View
            fetch('/telegram/test/submit/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: formData
            })
            .then(response => response.text())
            .then(html => {
                // Вставляем ответ (наш шаблон telegram_result.html)
                resultDiv.innerHTML = html;
                btn.disabled = false;
                btn.innerText = 'Отправить тестовое сообщение';
            })
            .catch(error => {
                resultDiv.innerHTML = '<span style="color: red;">Ошибка сети: ' + error + '</span>';
                btn.disabled = false;
                btn.innerText = 'Отправить тестовое сообщение';
            });
        });
    });
</script>
{% endblock %}
