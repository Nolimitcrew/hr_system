<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header bg-primary text-white">
            <h5 class="modal-title"><i class="bi bi-telegram"></i> Проверка уведомлений</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'telegram_test_submit' %}" hx-target="#telegram-result-container">
            <div class="modal-body">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted">Текст сообщения:</label>
                    <textarea name="message" class="form-control" rows="3" placeholder="Введите текст для проверки...">Привет! Это тестовое сообщение из HR-Системы. Связь работает отлично!</textarea>
                </div>
                <div id="telegram-result-container">
                    <!-- Сюда HTMX вставит результат -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Отправить</button>
            </div>
        </form>
    </div>
</div>
