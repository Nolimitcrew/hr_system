{% if success %}
    <div class="alert alert-success mt-3 mb-0">
        <i class="bi bi-check-circle-fill"></i> {{ message }}
    </div>
{% else %}
    <div class="alert alert-danger mt-3 mb-0">
        <i class="bi bi-x-circle-fill"></i> Ошибка: {{ message }}
        <hr>
        <small>Проверьте токен бота и Chat ID в настройках организации.</small>
    </div>
{% endif %}
