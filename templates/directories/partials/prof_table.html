<table class="table table-hover mb-0">
    <thead class="table-light"><tr><th>Название</th><th>Статус</th></tr></thead>
    <tbody>
        {% for p in professions %}
        <tr><td>{{ p.name }}</td><td>{% if p.is_active %}<span class="badge bg-success">Активно</span>{% else %}<span class="badge bg-secondary">Архив</span>{% endif %}</td></tr>
        {% empty %}<tr><td colspan="2" class="text-center text-muted py-3">Нет данных</td></tr>{% endfor %}
    </tbody>
</table>
